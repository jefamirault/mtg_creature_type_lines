# Creature Type-Line Groups at https://mtg.jefamirault.com/creature_type_combos/.
# Installed as /etc/nginx/snippets/mtg-creature_type_combos.conf; the mtg.jefamirault.com server
# block (~/projects/mtg/mtg_jefamirault_com/nginx-site.conf) includes snippets/mtg-*.conf, and
# redirects this app's old URLs from when it was at the root.

location = /creature_type_combos {
    return 301 /creature_type_combos/;
}

location ^~ /creature_type_combos/ {
    root /var/www;              # /creature_type_combos/x is /var/www/creature_type_combos/x
    index index.html;
    try_files $uri $uri/ =404;
    access_log /var/log/nginx/creature_type_combos_access.log;

    # No cache-busting: the page is checked on every load, the data for up to an hour.
    add_header Cache-Control "no-cache";
    include snippets/security-headers.conf;   # re-include: this block sets add_header
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        include snippets/security-headers.conf;
    }
}
